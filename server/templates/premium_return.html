<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Premium · возврат в приложение</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", Arial, sans-serif;
        background: linear-gradient(160deg, #ece8df, #dfe8e2);
        color: #1a1f1c;
        padding: 24px;
        box-sizing: border-box;
      }
      .card {
        max-width: 420px;
        background: #fff;
        border-radius: 16px;
        padding: 28px 22px;
        border: 1px solid rgba(27, 46, 36, 0.14);
        text-align: center;
      }
      h1 { margin: 0 0 10px; font-size: 22px; color: #1b2e24; }
      p { margin: 0 0 14px; color: #5b635c; line-height: 1.5; font-size: 15px; }
      a {
        display: inline-block;
        margin-top: 6px;
        padding: 12px 18px;
        border-radius: 10px;
        background: #1b2e24;
        color: #f3efe6;
        text-decoration: none;
        font-weight: 650;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Спасибо за поддержку</h1>
      <p>
        Если оплата прошла, Premium активируется в приложении автоматически.
        Можно вернуться в «12 шагов».
      </p>
      <a id="open" href="{{ deep_link }}">Открыть приложение</a>
      <p style="margin-top:18px;font-size:13px;">{{ domain }}</p>
    </div>
    <script>
      (function () {
        var link = {{ deep_link|tojson }};
        try { window.location.href = link; } catch (e) {}
      })();
    </script>
  </body>
</html>
