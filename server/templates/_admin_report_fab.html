{# Sticky "report admin bug" button. Set admin_report_from before include. #}
<style>
  .admin-report-fab {
    position: fixed;
    right: 0;
    top: 50%;
    z-index: 80;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 11.5rem;
    padding: 12px 14px 12px 16px;
    border-radius: 14px 0 0 14px;
    background: #1b2e24;
    color: #f3efe6 !important;
    text-decoration: none !important;
    font: 650 13px/1.25 "Segoe UI", Arial, sans-serif;
    box-shadow: 0 8px 24px rgba(27, 46, 36, 0.28);
    text-align: center;
    transform: translate(calc(100% - 18px), -50%);
    transition: transform .25s ease, background .2s ease, box-shadow .2s ease;
  }
  .admin-report-fab:hover,
  .admin-report-fab:focus-visible {
    transform: translate(0, -50%);
    background: #243a2e;
    box-shadow: 0 10px 28px rgba(27, 46, 36, 0.34);
  }
  @media (max-width: 720px) {
    .admin-report-fab {
      top: auto;
      bottom: 16px;
      width: auto;
      max-width: 12rem;
      padding: 10px 12px 10px 14px;
      font-size: 12px;
      transform: translateX(calc(100% - 16px));
    }
    .admin-report-fab:hover,
    .admin-report-fab:focus-visible,
    .admin-report-fab:active {
      transform: translateX(0);
    }
  }
</style>
<a class="admin-report-fab"
   href="{{ url_for('support_admin', report=1, from=admin_report_from|default('support')) }}">
  + Сообщить об ошибке в админке
</a>
